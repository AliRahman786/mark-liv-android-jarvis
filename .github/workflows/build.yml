name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        # Go exactly to where Jules put the code
        cd "Mark-LIV/Mark-LIV-main"
        
        # Make the Gradle script executable and build
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-debug-apk
        # This will search everywhere for the APK once built
        path: '**/*/build/outputs/apk/debug/app-debug.apk'
